<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResinForge · Studio</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<script>
  /* 首帧前定好主题与强调色，避免加载瞬间闪一下默认配色 */
  (function () {
    try {
      var m = localStorage.getItem('resinforge:theme') || 'dark';
      var dark = m === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : m === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-accent', localStorage.getItem('resinforge:accent') || 'neutral');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.setAttribute('data-accent', 'neutral');
    }
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/studio/main.jsx"></script>
</body>
</html>
