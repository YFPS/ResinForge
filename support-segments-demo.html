<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>PrusaSlicer 风格 SLA 支撑分段演示 · three.js</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#1a1d23}
  #panel{position:fixed;top:12px;left:12px;z-index:10;background:rgba(20,22,28,.88);color:#dfe3ea;
    padding:14px 16px;border-radius:10px;font-size:13px;line-height:1.7;max-width:280px;backdrop-filter:blur(6px)}
  #panel h1{font-size:15px;margin:0 0 8px;color:#fff}
  .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  label{display:block;cursor:pointer;user-select:none}
  #slider{width:100%;margin-top:6px}
  #hint{color:#8b93a3;font-size:12px;margin-top:8px}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="panel">
  <h1>SLA 支撑分段（PrusaSlicer 风格）</h1>
  <label><input type="checkbox" checked data-part="head"><span class="sw" style="background:#ff5370"></span>Head 销头（双球+锥裙）</label>
  <label><input type="checkbox" checked data-part="pillar"><span class="sw" style="background:#4fc3f7"></span>Pillar 立柱（圆柱+锥基座）</label>
  <label><input type="checkbox" checked data-part="junction"><span class="sw" style="background:#ffd54f"></span>Junction 节点球</label>
  <label><input type="checkbox" checked data-part="bridge"><span class="sw" style="background:#81c784"></span>Bridge / Crossbridge 桥接</label>
  <label><input type="checkbox" checked data-part="anchor"><span class="sw" style="background:#ce93d8"></span>Anchor 锚定短支撑</label>
  <label><input type="checkbox" checked data-part="pad"><span class="sw" style="background:#b0bec5"></span>Pad 垫板（waffle 网格）</label>
  <div style="margin-top:8px">分解视图: <span id="ev0">0</span><input id="slider" type="range" min="0" max="100" value="0"><span id="ev1">100</span></div>
  <div id="hint">拖动旋转 / 滚轮缩放 · 分段按 PrusaSlicer 的 9 类逻辑对象建模，各自独立网格化后 its_merge 拼接</div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- 场景 ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d23);
scene.add(new THREE.HemisphereLight(0xcfd8e3, 0x334, 0.9));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(3, 6, 4); scene.add(dl);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 200);
camera.position.set(9, 7, 11);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);

/* 打印平台 */
const bed = new THREE.Mesh(new THREE.CylinderGeometry(14,14,.3,64),
  new THREE.MeshStandardMaterial({color:0x37414f, metalness:.4, roughness:.6}));
bed.position.y = -.15; scene.add(bed);

/* ---------- 演示模型：环面结（Y-up，打印方向 +Y） ---------- */
const model = new THREE.Mesh(
  new THREE.TorusKnotGeometry(3.2, 1.0, 160, 24),
  new THREE.MeshStandardMaterial({color:0x90a4ae, metalness:.1, roughness:.45}));
model.position.y = 7.5; scene.add(model);

/* ---------- 分段网格工厂（对应 SupportTreeMesher） ---------- */
const groups = { head:new THREE.Group(), pillar:new THREE.Group(), junction:new THREE.Group(),
                 bridge:new THREE.Group(), anchor:new THREE.Group(), pad:new THREE.Group() };
for (const g of Object.values(groups)) scene.add(g);

const MAT = {
  head:     new THREE.MeshStandardMaterial({color:0xff5370, roughness:.35, metalness:.15}),
  pillar:   new THREE.MeshStandardMaterial({color:0x4fc3f7, roughness:.4,  metalness:.15}),
  junction: new THREE.MeshStandardMaterial({color:0xffd54f, roughness:.35, metalness:.2}),
  bridge:   new THREE.MeshStandardMaterial({color:0x81c784, roughness:.4,  metalness:.15}),
  anchor:   new THREE.MeshStandardMaterial({color:0xce93d8, roughness:.4,  metalness:.15}),
  pad:      new THREE.MeshStandardMaterial({color:0xb0bec5, roughness:.55, metalness:.1}),
};

/* Head：两个部分球 + 圆锥裙（pinhead），尖朝 dir */
function addHead(pos, dir, rPin=.35, rBack=.8, width=1.2){
  const g = new THREE.Group();
  const tip = new THREE.Mesh(new THREE.SphereGeometry(rPin, 24, 16), MAT.head);
  const back = new THREE.Mesh(new THREE.SphereGeometry(rBack, 24, 16), MAT.head);
  const robe = new THREE.Mesh(
    new THREE.CylinderGeometry(rPin, rBack, width - rPin - rBack, 24, 1, true), MAT.head);
  const h = width/2 - rBack;
  tip.position.y = -width/2 + rPin;
  back.position.y =  width/2 - rBack;
  robe.position.y = h + (width - rPin - rBack)/2 - (width/2 - rPin - rBack) - 0.0001;
  robe.position.y = -(width/2) + rPin + (width - rPin - rBack)/2;
  g.add(tip, robe, back);
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,-1,0), dir.clone().normalize());
  g.quaternion.copy(q); g.position.copy(pos);
  g.userData.home = pos.clone(); g.userData.axis = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0));
  groups.head.add(g);
}
/* Pillar：圆柱 + halfcone 基座 */
function addPillar(x, z, yTop, r=.55, rBase=1.6, baseH=1.0){
  const g = new THREE.Group();
  const len = yTop - baseH;
  if (len > 0){
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 20), MAT.pillar);
    cyl.position.y = baseH + len/2; g.add(cyl);
  }
  const cone = new THREE.Mesh(new THREE.CylinderGeometry(rBase, r, baseH, 20), MAT.pillar);
  cone.position.y = baseH/2; g.add(cone);
  g.position.set(x, 0, z);
  g.userData.home = g.position.clone();
  groups.pillar.add(g);
  return new THREE.Vector3(x, yTop, z);
}
function addJunction(p, r=.8){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), MAT.junction);
  m.position.copy(p); m.userData.home = p.clone();
  groups.junction.add(m);
}
function addBridge(a, b, r=.45){
  const d = b.clone().sub(a), len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 16), MAT.bridge);
  m.position.copy(a).addScaledVector(d, .5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  m.userData.home = m.position.clone();
  groups.bridge.add(m);
}
/* Anchor：贴模型的短支撑 */
function addAnchor(pSurface, dirOut){
  const g = new THREE.Group();
  const len = 1.6;
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(.4, .55, len, 16), MAT.anchor);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(.5, 18, 12), MAT.anchor);
  tip.position.y = -len/2;
  g.add(cyl, tip);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dirOut.clone().normalize());
  g.position.copy(pSurface).addScaledVector(dirOut, len/2);
  g.userData.home = g.position.clone();
  groups.anchor.add(g);
}

/* ---------- Pad：waffle 风格网格板 ---------- */
(function buildPad(){
  const padY = .3, t = .18, rPad = 9.5;
  const g = groups.pad;
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(rPad, rPad, t, 64), MAT.pad);
  ring.position.y = padY + t/2; g.add(ring);
  for (let i = -2; i <= 2; i++){
    const p = i * 1.6, w = Math.sqrt(Math.max(rPad*rPad - p*p, 0));
    const bar1 = new THREE.Mesh(new THREE.BoxGeometry(2*w, t, .5), MAT.pad);
    bar1.position.set(0, padY + t, p); g.add(bar1);
    const bar2 = new THREE.Mesh(new THREE.BoxGeometry(.5, t, 2*w), MAT.pad);
    bar2.position.set(p, padY + t, 0); g.add(bar2);
  }
  g.children.forEach(c => c.userData.home = c.position.clone());
})();

/* ---------- 布置一棵演示支撑树 ---------- */
const GROUND = 0.3;                       // pad 顶面
// 落地支撑（三根柱 + head + junction + 横向 crossbridge）
const pA = addPillar(-3.0, -2.2, GROUND + 2.6);
const pB = addPillar( 4.2, -0.8, GROUND + 3.4);
const pC = addPillar( 0.6,  3.6, GROUND + 4.0);
addJunction(pA); addJunction(pB); addJunction(pC);
addHead(pA.clone().add(new THREE.Vector3(0,1.1,0)), new THREE.Vector3(-.25,1,-.2).normalize());
addHead(pB.clone().add(new THREE.Vector3(0,1.1,0)), new THREE.Vector3(.3,1,.1).normalize());
addHead(pC.clone().add(new THREE.Vector3(0,1.1,0)), new THREE.Vector3(0,1,.3).normalize());
addBridge(pA.clone().add(new THREE.Vector3(0,1.2,0)), pB.clone().add(new THREE.Vector3(0,1.2,0)), .3); // crossbridge
addBridge(pB.clone().add(new THREE.Vector3(0,1.8,0)), pC.clone().add(new THREE.Vector3(0,1.8,0)), .3);
// anchor 短支撑（贴模型表面）
addAnchor(new THREE.Vector3(0, 10.2, 3.9), new THREE.Vector3(.1,.45,1));
addAnchor(new THREE.Vector3(-4.0, 8.6, 1.6), new THREE.Vector3(-.9,.35,.4));
addAnchor(new THREE.Vector3(4.2, 7.6, -1.8), new THREE.Vector3(.8,.2,-.55));

/* ---------- 分解视图 ---------- */
const slider = document.getElementById('slider');
const centers = { head:new THREE.Vector3(0,9,0), pillar:new THREE.Vector3(0,3,0),
  junction:new THREE.Vector3(-6,7,0), bridge:new THREE.Vector3(6,7,0),
  anchor:new THREE.Vector3(0,12,0), pad:new THREE.Vector3(0,-2,0) };
slider.oninput = () => {
  const k = slider.value / 100;
  for (const [name, g] of Object.entries(groups)){
    const dir = centers[name].clone().sub(new THREE.Vector3(0,4,0)).normalize();
    g.position.copy(dir.multiplyScalar(k * 4.5));
  }
};

/* 分组开关 */
for (const cb of document.querySelectorAll('[data-part]'))
  cb.onchange = () => groups[cb.dataset.part].visible = cb.checked;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
